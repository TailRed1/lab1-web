{{#> layout
    pageTitle="Контакти"
    studentGroup="6.1214-пі-2"
    studentEmail="wwwd.timkov2@gmail.com"
}}

<h2 class="main__title">
    Зв'яжіться з нами
</h2>


<form
    class="contact-form"
    action="#"
>

    <div class="contact-form__item">

        <label
            class="contact-form__label"
            for="name"
        >
            Ім'я
        </label>

        <input
            class="contact-form__input"
            type="text"
            id="name"
            name="name"
            required
            minlength="2"
            maxlength="50"
            pattern="[A-Za-zА-Яа-яІіЇїЄєҐґ' -]+"
        >

    </div>


    <div class="contact-form__item">

        <label
            class="contact-form__label"
            for="email"
        >
            Email
        </label>

        <input
            class="contact-form__input"
            type="email"
            id="email"
            name="email"
            required
        >

    </div>


    <div class="contact-form__item">

        <label
            class="contact-form__label"
            for="phone"
        >
            Телефон
        </label>

        <input
            class="contact-form__input"
            type="tel"
            id="phone"
            name="phone"
            placeholder="+380XXXXXXXXX"
            pattern="\+380[0-9]{9}"
            required
        >

    </div>


    <div class="contact-form__item">

        <label
            class="contact-form__label"
            for="message"
        >
            Повідомлення
        </label>

        <textarea
            class="contact-form__textarea"
            id="message"
            name="message"
            rows="5"
            minlength="10"
            maxlength="500"
            required
        ></textarea>

    </div>


    <button
        class="contact-form__button"
        type="submit"
    >
        Надіслати
    </button>

</form>

{{/layout}}
