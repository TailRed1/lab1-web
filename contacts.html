<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Контактна сторінка навчального лендінгу.">

    <title>Лабораторна 3 - Контакти</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <a class="skip-link" href="#main">
        Перейти до основного контенту
    </a>

    <header class="header">

        <h1 class="header__title">
            Мій перший лендінг
        </h1>

        <nav class="navigation"
             aria-label="Головна навігація">

            <ul class="navigation__list">

                <li class="navigation__item">
                    <a class="navigation__link"
                       href="index.html">
                        Головна
                    </a>
                </li>

                <li class="navigation__item">
                    <a class="navigation__link"
                       href="about.html">
                        Про нас
                    </a>
                </li>

                <li class="navigation__item">
                    <a class="navigation__link"
                       href="contacts.html"
                       aria-current="page">
                        Контакти
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <main class="main" id="main">

        <h2 class="main__title">
            Зв'яжіться з нами
        </h2>

        <form class="contact-form" action="#">

            <div class="contact-form__item">

                <label class="contact-form__label"
                       for="name">
                    Ім'я:
                </label>

                <input
                    class="contact-form__input"
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Ваше ім'я"
                    required
                    minlength="2"
                    maxlength="50"
                    pattern="[A-Za-zА-Яа-яІіЇїЄєҐґ' -]+"
                    title="Ім'я може містити лише літери, пробіл, апостроф або дефіс"
                >

            </div>


            <div class="contact-form__item">

                <label class="contact-form__label"
                       for="email">
                    Email:
                </label>

                <input
                    class="contact-form__input"
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@gmail.com"
                    required
                >

            </div>


            <div class="contact-form__item">

                <label class="contact-form__label"
                       for="phone">
                    Телефон:
                </label>

                <input
                    class="contact-form__input"
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="+380XXXXXXXXX"
                    required
                    pattern="\+380[0-9]{9}"
                    title="Введіть номер у форматі +380XXXXXXXXX"
                >

            </div>


            <div class="contact-form__item">

                <label class="contact-form__label"
                       for="message">
                    Повідомлення:
                </label>

                <textarea
                    class="contact-form__textarea"
                    id="message"
                    name="message"
                    placeholder="Ваше повідомлення"
                    rows="5"
                    required
                    minlength="10"
                    maxlength="500"
                ></textarea>

            </div>


            <button
                class="contact-form__button"
                type="submit"
            >
                Надіслати
            </button>

        </form>

    </main>


    <aside class="sidebar sidebar--social">

        <h3 class="sidebar__title">
            Соціальні мережі
        </h3>

        <ul class="sidebar__list">

            <li class="sidebar__item">
                <a class="sidebar__link"
                   href="#">
                    Facebook
                </a>
            </li>

            <li class="sidebar__item">
                <a class="sidebar__link"
                   href="#">
                    Instagram
                </a>
            </li>

            <li class="sidebar__item">
                <a class="sidebar__link"
                   href="#">
                    LinkedIn
                </a>
            </li>

        </ul>

    </aside>


    <footer class="footer">

        <p class="footer__text">
            © 2026 Група 6.1214-пі-2
        </p>

    </footer>

</body>

</html>
