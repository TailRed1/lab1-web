{{#> layout
    pageTitle="Про нас"
    pageCode="about"
    studentGroup="6.1214-пі-2"
    studentEmail="wwwd.timkov2@gmail.com"
}}

<section class="team">

    <h2 class="team__title">
        Наша команда
    </h2>

    <div
    class="
        team__list
        grid
        grid-cols-1
        md:grid-cols-2
        xl:grid-cols-3
        gap-6
    "
    ></div>


    <template id="employee-card-tpl">

        <article
            class="
                employee-card
                overflow-hidden
                rounded-lg
                border
                border-[color:var(--border)]
                bg-[color:var(--surface)]
                shadow-[var(--shadow)]
            "
        >

            <img
                class="employee-card__photo w-full h-48 object-cover"
                src=""
                alt=""
                loading="lazy"
            >

            <div class="employee-card__body p-4">

                <h3 class="employee-card__name"></h3>

                <p class="employee-card__role text-[color:var(--muted)]"></p>

                <a
                    class="employee-card__cta btn-brand"
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Профіль
                </a>

            </div>

        </article>

    </template>

</section>

{{/layout}}
